server:
  host: 127.0.0.1
  port: 8000
  open_browser: true

ansible:
  ansible_playbook_path: "ansible-playbook"
  inventory: "inventory.ini"
  check_playbook: "check_base_env.yml"
  check_report_dir: "reports"
  cos_setup_playbook: "deploy_eva_robot检测/batch_cos_setup.yml"
  ssh_connect_timeout: 5
  ssh_precheck_timeout_seconds: 3
  ssh_retries: 1
  ansible_timeout: 15
  prompt_timeout: 15
  no_output_notice_seconds: 30
  check_timeout_seconds: 600
  install_timeout_seconds: 1800
  cos_setup_timeout_seconds: 1800

reports:
  latest_summary: "reports/latest_summary.json"
