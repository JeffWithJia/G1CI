---
- name: Set dex1 paths
  ansible.builtin.set_fact:
    dex1_dir: "{{ project_dir }}/dex1_1_service"
    dex1_bin_dir: "{{ project_dir }}/dex1_1_service/bin"
    dex1_server_bin: "{{ project_dir }}/dex1_1_service/bin/dex1_1_gripper_server"
    dex1_test_bin: "{{ project_dir }}/dex1_1_service/bin/test_dex1_1_gripper_server"
    dex1_service_name: dex1_gripper.service
    dex1_service_file: /etc/systemd/system/dex1_gripper.service

- name: Check dex1 files
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop:
    - name: dex1 source directory
      path: "{{ dex1_dir }}"
    - name: dex1 bin directory
      path: "{{ dex1_bin_dir }}"
    - name: dex1 server binary
      path: "{{ dex1_server_bin }}"
    - name: dex1 test binary
      path: "{{ dex1_test_bin }}"
    - name: dex1 systemd unit file
      path: "{{ dex1_service_file }}"
  register: dex1_file_stats

- name: Record dex1 file status
  ansible.builtin.set_fact:
    g1_check_results: "{{ g1_check_results + [{'name': item.item.name, 'status': ('OK' if item.stat.exists | default(false) else 'FAIL'), 'detail': item.item.path}] }}"
  loop: "{{ dex1_file_stats.results }}"

- name: Check dex1 server binary executable bit
  ansible.builtin.command: "test -x {{ dex1_server_bin }}"
  register: dex1_server_executable
  changed_when: false
  failed_when: false

- name: Record dex1 server executable status
  ansible.builtin.set_fact:
    g1_check_results: "{{ g1_check_results + [{'name': 'dex1 server executable', 'status': ('OK' if dex1_server_executable.rc == 0 else 'FAIL'), 'detail': dex1_server_bin}] }}"

- name: Check dex1 dynamic library dependencies
  ansible.builtin.command: "ldd {{ dex1_server_bin }}"
  register: dex1_ldd
  changed_when: false
  failed_when: false

- name: Record dex1 dynamic library status
  ansible.builtin.set_fact:
    g1_check_results: "{{ g1_check_results + [{'name': 'dex1 shared libraries', 'status': ('OK' if dex1_ldd.rc == 0 and 'not found' not in dex1_ldd.stdout else 'FAIL'), 'detail': ('ldd rc=' ~ dex1_ldd.rc)}] }}"

- name: Check dex1 service enabled state
  ansible.builtin.command: "systemctl is-enabled {{ dex1_service_name }}"
  register: dex1_service_enabled
  changed_when: false
  failed_when: false

- name: Check dex1 service active state
  ansible.builtin.command: "systemctl is-active {{ dex1_service_name }}"
  register: dex1_service_active
  changed_when: false
  failed_when: false

- name: Initialize dex1 service recovery result
  ansible.builtin.set_fact:
    dex1_service_recovery_allowed: "{{ g1_run_mode == 'install' or auto_recover_services_in_check | default(false) | bool }}"
    dex1_service_final_active: "{{ dex1_service_active.stdout | trim }}"
    dex1_service_active_detail: "{{ dex1_service_active.stdout | trim }}"
    dex1_service_recovery_attempts: 0
    dex1_service_recovery_stdout: ""
    dex1_service_recovery_stderr: ""

- name: Restart dex1 service until active
  become: true
  ansible.builtin.shell: |
    restart_rc=0
    systemctl restart {{ dex1_service_name }} || restart_rc=$?
    sleep {{ service_recovery_delay | int }}
    systemctl is-active {{ dex1_service_name }} || true
    exit "$restart_rc"
  args:
    executable: /bin/bash
  register: dex1_service_recovery
  changed_when: dex1_service_recovery.stdout | trim == 'active'
  failed_when: false
  until: dex1_service_recovery.stdout | trim == 'active'
  retries: "{{ service_recovery_retries | int }}"
  delay: 0
  when:
    - dex1_service_recovery_allowed | bool
    - dex1_service_active.stdout | trim != 'active'

- name: Recheck dex1 service active state after recovery
  ansible.builtin.command: "systemctl is-active {{ dex1_service_name }}"
  register: dex1_service_active_after_recovery
  changed_when: false
  failed_when: false
  when:
    - dex1_service_recovery_allowed | bool
    - dex1_service_active.stdout | trim != 'active'

- name: Update dex1 service recovery result
  ansible.builtin.set_fact:
    dex1_service_final_active: "{{ dex1_service_active_after_recovery.stdout | default(dex1_service_recovery.stdout | default(dex1_service_active.stdout)) | trim }}"
    dex1_service_active_detail: "{{ ('active after restart attempt ' ~ (dex1_service_recovery.attempts | default(1))) if (dex1_service_active_after_recovery.stdout | default(dex1_service_recovery.stdout | default('')) | trim == 'active') else ('still ' ~ (dex1_service_active_after_recovery.stdout | default(dex1_service_recovery.stdout | default(dex1_service_active.stdout)) | trim) ~ ' after ' ~ (dex1_service_recovery.attempts | default(service_recovery_retries)) ~ ' restart attempts') }}"
    dex1_service_recovery_attempts: "{{ dex1_service_recovery.attempts | default(0) }}"
    dex1_service_recovery_stdout: "{{ dex1_service_recovery.stdout | default('') }}"
    dex1_service_recovery_stderr: "{{ dex1_service_recovery.stderr | default('') }}"
  when:
    - dex1_service_recovery_allowed | bool
    - dex1_service_active.stdout | trim != 'active'

- name: Collect dex1 service status after failed recovery
  ansible.builtin.command: "systemctl status {{ dex1_service_name }} --no-pager -l"
  register: dex1_service_status_after_recovery
  changed_when: false
  failed_when: false
  when:
    - dex1_service_recovery_allowed | bool
    - dex1_service_active.stdout | trim != 'active'
    - dex1_service_final_active | trim != 'active'

- name: Collect dex1 service journal after failed recovery
  ansible.builtin.command: "journalctl -u {{ dex1_service_name }} -n 50 --no-pager"
  register: dex1_service_journal_after_recovery
  changed_when: false
  failed_when: false
  when:
    - dex1_service_recovery_allowed | bool
    - dex1_service_active.stdout | trim != 'active'
    - dex1_service_final_active | trim != 'active'

- name: Record dex1 service status
  ansible.builtin.set_fact:
    g1_check_results: "{{ g1_check_results + [
      {'name': 'dex1 service enabled', 'status': ('OK' if dex1_service_enabled.stdout | trim == 'enabled' else 'WARN'), 'detail': dex1_service_enabled.stdout | trim},
      {'name': 'dex1 service active', 'status': ('OK' if dex1_service_final_active | trim == 'active' else 'WARN'), 'detail': dex1_service_active_detail, 'stdout': dex1_service_recovery_stdout ~ '\n--- systemctl status ---\n' ~ (dex1_service_status_after_recovery.stdout | default('')) ~ '\n--- journalctl -u dex1_gripper.service -n 50 ---\n' ~ (dex1_service_journal_after_recovery.stdout | default('')), 'stderr': dex1_service_recovery_stderr ~ '\n--- systemctl status stderr ---\n' ~ (dex1_service_status_after_recovery.stderr | default('')) ~ '\n--- journalctl stderr ---\n' ~ (dex1_service_journal_after_recovery.stderr | default(''))}
    ] }}"

- name: Collect dex1 recent service journal
  ansible.builtin.shell: |
    set +e
    journalctl -u {{ dex1_service_name }} -n 120 --no-pager -o cat
    exit 0
  args:
    executable: /bin/bash
  register: dex1_service_health_journal
  changed_when: false
  failed_when: false

- name: Detect dex1 service health issue
  ansible.builtin.set_fact:
    dex1_service_health_issue: >-
      {{
        (
          dex1_service_final_active | trim == 'active'
        ) and (
          not (
            (
              (dex1_service_health_journal.stdout | default('')) is search('Available Serial Ports') and
              (dex1_service_health_journal.stdout | default('')) is search('Detected motors') and
              (dex1_service_health_journal.stdout | default('')) is search('Side: right') and
              (dex1_service_health_journal.stdout | default('')) is search('Side: left') and
              (dex1_service_health_journal.stdout | default('')) is search('Dex1-1 Gripper Server.*started')
            ) or (
              (dex1_service_health_journal.stdout | default('')) is search('No DDS command received on rt/dex1/right/cmd.*motor 0.*publishing state') and
              (dex1_service_health_journal.stdout | default('')) is search('No DDS command received on rt/dex1/left/cmd.*motor 1.*publishing state')
            )
          )
        )
      }}

- name: Restart dex1 service after health issue
  become: true
  ansible.builtin.shell: |
    systemctl restart {{ dex1_service_name }}
    sleep {{ service_recovery_delay | int }}
    systemctl is-active {{ dex1_service_name }}
  args:
    executable: /bin/bash
  register: dex1_service_health_restart
  changed_when: dex1_service_health_restart.rc == 0
  failed_when: false
  when: dex1_service_health_issue | bool

- name: Collect dex1 recent service journal after health restart
  ansible.builtin.shell: |
    set +e
    journalctl -u {{ dex1_service_name }} -n 120 --no-pager -o cat
    exit 0
  args:
    executable: /bin/bash
  register: dex1_service_health_journal_after_restart
  changed_when: false
  failed_when: false
  when: dex1_service_health_issue | bool

- name: Record dex1 motor binding health
  ansible.builtin.set_fact:
    g1_check_results: "{{ g1_check_results + [dex1_motor_binding_result] }}"
  vars:
    dex1_health_log: "{{ dex1_service_health_journal_after_restart.stdout | default(dex1_service_health_journal.stdout | default('')) }}"
    dex1_startup_health_ok: >-
      {{
        dex1_health_log is search('Available Serial Ports') and
        dex1_health_log is search('Detected motors') and
        dex1_health_log is search('Side: right') and
        dex1_health_log is search('Side: left') and
        dex1_health_log is search('Dex1-1 Gripper Server.*started')
      }}
    dex1_runtime_health_ok: >-
      {{
        dex1_health_log is search('No DDS command received on rt/dex1/right/cmd.*motor 0.*publishing state') and
        dex1_health_log is search('No DDS command received on rt/dex1/left/cmd.*motor 1.*publishing state')
      }}
    dex1_health_ok: >-
      {{
        dex1_service_final_active | trim == 'active' and
        dex1_service_enabled.stdout | trim == 'enabled' and
        (
          dex1_startup_health_ok | bool or
          dex1_runtime_health_ok | bool
        )
      }}
    dex1_health_fail: "{{ dex1_service_final_active | trim != 'active' or dex1_service_enabled.stdout | trim != 'enabled' }}"
    dex1_motor_binding_result:
      name: dex1 motor binding
      status: "{{ 'OK' if dex1_health_ok | bool else 'FAIL' if dex1_health_fail | bool else 'WARN' }}"
      detail: "{{ 'Dex1 left/right motors detected and server started' if dex1_startup_health_ok | bool else 'Dex1 left/right motors publishing state' if dex1_runtime_health_ok | bool else dex1_health_log }}"
      stdout: "{{ dex1_health_log }}"
      stderr: "{{ dex1_service_health_restart.stderr | default('') }}"
      reason: "{{ '' if dex1_health_ok | bool else 'Dex1 服务未正常运行。' if dex1_health_fail | bool else 'Dex1 服务已启动，但未确认左右手电机绑定成功。' }}"
      suggestion: "{{ '' if dex1_health_ok | bool else '请检查 Dex1 服务文件、程序路径、有线连接和硬件状态。' if dex1_health_fail | bool else '请尝试重启 dex1_gripper.service；如果仍异常，请检查 Dex1 有线连接、串口识别和硬件状态。' }}"

- name: Record dex1 service recovery install result
  ansible.builtin.set_fact:
    g1_install_results: "{{ g1_install_results + [{
      'name': 'dex1 service recovery',
      'changed': dex1_service_recovery.changed | default(false),
      'rc': 0,
      'status': 'OK' if dex1_service_final_active | trim == 'active' else 'WARN',
      'detail': dex1_service_active_detail,
      'stdout': dex1_service_recovery_stdout ~ '\n--- systemctl status ---\n' ~ (dex1_service_status_after_recovery.stdout | default('')) ~ '\n--- journalctl -u dex1_gripper.service -n 50 ---\n' ~ (dex1_service_journal_after_recovery.stdout | default('')),
      'stderr': dex1_service_recovery_stderr ~ '\n--- systemctl status stderr ---\n' ~ (dex1_service_status_after_recovery.stderr | default('')) ~ '\n--- journalctl stderr ---\n' ~ (dex1_service_journal_after_recovery.stderr | default(''))
    }] }}"
  when: g1_run_mode == 'install'

- name: Check conflicting brainco service enabled state
  ansible.builtin.command: "systemctl is-enabled brainco_hand.service"
  register: conflicting_brainco_service_enabled
  changed_when: false
  failed_when: false
  when: check_conflicting_end_effector_service | default(false) | bool

- name: Check conflicting brainco service active state
  ansible.builtin.command: "systemctl is-active brainco_hand.service"
  register: conflicting_brainco_service_active
  changed_when: false
  failed_when: false
  when: check_conflicting_end_effector_service | default(false) | bool

- name: Record conflicting brainco service status
  ansible.builtin.set_fact:
    g1_check_results: "{{ g1_check_results + [conflicting_brainco_result] }}"
  vars:
    conflicting_brainco_active: "{{ conflicting_brainco_service_active.stdout | default('unknown') | trim }}"
    conflicting_brainco_enabled: "{{ conflicting_brainco_service_enabled.stdout | default('unknown') | trim }}"
    conflicting_brainco_result:
      name: conflicting brainco service
      status: "{{ 'WARN' if conflicting_brainco_active == 'active' else 'OK' }}"
      detail: "active={{ conflicting_brainco_active }}, enabled={{ conflicting_brainco_enabled }}"
      stdout: "{{ conflicting_brainco_service_active.stdout | default('') ~ '\n' ~ conflicting_brainco_service_enabled.stdout | default('') }}"
      stderr: "{{ conflicting_brainco_service_active.stderr | default('') ~ '\n' ~ conflicting_brainco_service_enabled.stderr | default('') }}"
      reason: "{{ 'Conflicting brainco_hand.service is active while end_effector=dex1.' if conflicting_brainco_active == 'active' else '' }}"
      suggestion: "{{ 'Run install mode to stop and disable the conflicting Brainco service, or stop it manually.' if conflicting_brainco_active == 'active' else '' }}"
  when: check_conflicting_end_effector_service | default(false) | bool
