<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unitree-G1 Camera Control</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="app-header">
    <div class="brand-block">
      <div class="brand-mark"><i data-lucide="aperture"></i></div>
      <div>
        <h1>Unitree-G1 Camera Control</h1>
        <div class="connection-line">
          <span id="statusDot" class="status-dot offline"></span>
          <span id="statusText">正在连接</span>
        </div>
      </div>
    </div>

    <div class="header-actions">
      <label class="device-select-wrap">
        <span>摄像头</span>
        <select id="deviceSelect" aria-label="摄像头"></select>
      </label>
      <button id="refreshDevices" class="icon-button" type="button" title="刷新设备" aria-label="刷新设备">
        <i data-lucide="refresh-cw"></i>
      </button>
      <button id="saveCurrent" class="icon-button" type="button" title="保存当前参数" aria-label="保存当前参数">
        <i data-lucide="save"></i>
      </button>
      <button id="applySaved" class="icon-button" type="button" title="应用已保存参数" aria-label="应用已保存参数">
        <i data-lucide="archive-restore"></i>
      </button>
      <span class="toolbar-divider"></span>
      <button id="importProfile" class="icon-button" type="button" title="导入参数" aria-label="导入参数">
        <i data-lucide="upload"></i>
      </button>
      <button id="exportProfile" class="icon-button" type="button" title="导出参数" aria-label="导出参数">
        <i data-lucide="download"></i>
      </button>
      <input id="profileFile" type="file" accept=".json,.conf,application/json" hidden>
    </div>
  </header>

  <main class="workspace">
    <section class="viewer-pane" aria-label="摄像头预览">
      <div class="viewer-toolbar">
        <div class="stream-options">
          <label>
            <span>格式</span>
            <select id="formatSelect"></select>
          </label>
          <label>
            <span>分辨率</span>
            <select id="sizeSelect"></select>
          </label>
          <label>
            <span>帧率</span>
            <select id="fpsSelect"></select>
          </label>
          <div class="segmented" id="viewSelect" aria-label="画面视图">
            <button type="button" data-view="full" class="active">完整</button>
            <button type="button" data-view="left">左目</button>
            <button type="button" data-view="right">右目</button>
          </div>
        </div>
        <div class="viewer-actions">
          <button id="toggleStream" class="icon-button" type="button" title="开始预览" aria-label="开始预览">
            <i data-lucide="play"></i>
          </button>
          <button id="restartStream" class="icon-button" type="button" title="重启预览" aria-label="重启预览" disabled>
            <i data-lucide="rotate-cw"></i>
          </button>
          <button id="snapshot" class="command-button" type="button">
            <i data-lucide="camera"></i><span>抓图</span>
          </button>
        </div>
      </div>

      <div class="video-stage-wrap">
        <div id="videoStage" class="video-stage">
          <img id="cameraStream" alt="摄像头实时画面">
          <div id="streamPlaceholder" class="stream-placeholder">
            <i data-lucide="video-off"></i>
            <strong>等待视频流</strong>
            <span id="streamMessage">请选择可用摄像头</span>
          </div>
          <div class="frame-badge" id="frameBadge">1280 x 720 · FULL</div>
        </div>
      </div>

      <div class="viewer-footer">
        <div class="device-meta">
          <span id="deviceName">未选择设备</span>
          <code id="devicePath">-</code>
        </div>
        <button id="copyDevicePath" class="icon-button small" type="button" title="复制设备路径" aria-label="复制设备路径">
          <i data-lucide="copy"></i>
        </button>
      </div>
    </section>

    <aside class="controls-pane">
      <div class="controls-header">
        <div>
          <h2>图像参数</h2>
          <span id="controlCount">0 项</span>
        </div>
        <div class="controls-actions">
          <button id="reloadControls" class="icon-button" type="button" title="重新读取参数" aria-label="重新读取参数">
            <i data-lucide="refresh-cw"></i>
          </button>
          <button id="resetDefaults" class="icon-button danger-hover" type="button" title="恢复设备默认值" aria-label="恢复设备默认值">
            <i data-lucide="undo-2"></i>
          </button>
        </div>
      </div>

      <div class="search-wrap">
        <i data-lucide="search"></i>
        <input id="controlSearch" type="search" placeholder="搜索参数" autocomplete="off">
      </div>

      <div id="controlsList" class="controls-list"></div>
    </aside>
  </main>

  <div id="toastRegion" class="toast-region" aria-live="polite"></div>
  <dialog id="confirmDialog">
    <form method="dialog">
      <div class="dialog-icon"><i data-lucide="triangle-alert"></i></div>
      <h3>恢复设备默认值</h3>
      <p>当前摄像头的全部可写参数将被重置。</p>
      <div class="dialog-actions">
        <button value="cancel" class="secondary-button">取消</button>
        <button value="confirm" class="danger-button">恢复默认</button>
      </div>
    </form>
  </dialog>

  <script src="/assets/lucide.min.js"></script>
  <script src="/assets/app.js"></script>
</body>
</html>
