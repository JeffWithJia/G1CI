---
- name: Check G1 base environment
  hosts: g1_robots
  gather_facts: true
  become: false

  vars:
    project_dir: /home/unitree/g1_setup
    conda_default_base_dir: /home/unitree/miniconda3
    tv_env_name: tv
    expected_tv_python_major_minor: "3.10"
    recreate_tv_if_version_mismatch: false
    allow_online_apt: false

    unitree_sdk_dir: "{{ project_dir }}/unitree_sdk2"
    unitree_sdk_lib: /usr/local/lib/libunitree_sdk2.a
    unitree_sdk_config: /usr/local/lib/cmake/unitree_sdk2/unitree_sdk2Config.cmake
    unitree_sdk_header: /usr/local/include/unitree/idl/go2/MotorCmds_.hpp

    pypi_mirror: https://pypi.tuna.tsinghua.edu.cn/simple
    miniconda_installers:
      - "{{ project_dir }}/miniconda3/miniconda.sh"
      - "{{ project_dir }}/miniconda.sh"

    apt_packages:
      - build-essential
      - cmake
      - make
      - libeigen3-dev
      - libspdlog-dev
      - libfmt-dev
      - libboost-all-dev
      - libyaml-cpp-dev

    python_packages:
      - import_name: cv2
        pip_name: opencv-python
        display_name: Python cv2
      - import_name: zmq
        pip_name: pyzmq
        display_name: Python zmq
      - import_name: logging_mp
        pip_name: logging_mp
        display_name: Python logging_mp
      - import_name: av
        pip_name: av
        display_name: Python av
      - import_name: numpy
        pip_name: numpy
        display_name: Python numpy

    camera_rule_file: /etc/udev/rules.d/99-usb-cameras.rules
    camera_links:
      - /dev/cam_head
      - /dev/cam_wrist_left
      - /dev/cam_wrist_right
    camera_topics:
      - topic: /cam_head/compressed_image
        label: 头部相机
      - topic: /cam_wrist_left/compressed_image
        label: 左腕相机
      - topic: /cam_wrist_right/compressed_image
        label: 右腕相机
    camera_topic_min_rate_hz: 0.0

    remote_binary: "{{ project_dir }}/remote"
    remote_source_dir: "{{ project_dir }}/remote_start"
    remote_service_name: remote_start.service
    remote_service_file: /etc/systemd/system/remote_start.service
    remote_project_service_file: "{{ project_dir }}/remote_start.service"
    stop_remote_start_during_run: true
    start_remote_start_after_install: false
    check_remote_start: false
    service_recovery_retries: 2
    service_recovery_delay: 5
    auto_recover_services_in_check: false
    stop_conflicting_end_effector_service: true
    disable_conflicting_end_effector_service: true
    check_conflicting_end_effector_service: false

    supported_end_effectors:
      - dex1
      - brainco
      - none

  tasks:
    - name: Normalize run mode
      ansible.builtin.set_fact:
        g1_run_mode: "{{ lookup('vars', 'g1_mode', default='check') | lower }}"

    - name: Validate run mode
      ansible.builtin.assert:
        that:
          - g1_run_mode in ['check', 'install']
        fail_msg: "g1_mode must be check or install, got: {{ g1_run_mode }}"

    - name: Initialize result buckets
      ansible.builtin.set_fact:
        g1_check_results: []
        g1_check_warnings: []
        g1_install_results: []

    - name: Normalize end effector type
      ansible.builtin.set_fact:
        g1_end_effector: "{{ end_effector | default('unknown') | lower | trim }}"

    - name: Warn when end_effector is missing or invalid
      ansible.builtin.set_fact:
        g1_check_warnings: "{{ g1_check_warnings + ['end_effector is missing or invalid: ' ~ g1_end_effector ~ '. Supported: dex1, brainco, none'] }}"
      when: g1_end_effector not in supported_end_effectors

    - name: Check remote_start service presence before run
      ansible.builtin.command: "systemctl list-unit-files {{ remote_service_name }} --no-legend --no-pager"
      register: remote_start_preflight_unit
      changed_when: false
      failed_when: false

    - name: Stop remote_start service during run
      become: true
      ansible.builtin.command: "systemctl stop {{ remote_service_name }}"
      register: remote_start_preflight_stop
      changed_when: remote_start_preflight_stop.rc == 0
      failed_when: false
      when:
        - stop_remote_start_during_run | default(true) | bool
        - remote_start_preflight_unit.stdout | default('') | trim | length > 0

    - name: Record remote_start preflight stop check result
      ansible.builtin.set_fact:
        g1_check_results: "{{ g1_check_results + [remote_start_preflight_check_result] }}"
      vars:
        remote_start_preflight_exists: "{{ remote_start_preflight_unit.stdout | default('') | trim | length > 0 }}"
        remote_start_preflight_stop_enabled: "{{ stop_remote_start_during_run | default(true) | bool }}"
        remote_start_preflight_stop_ok: "{{ remote_start_preflight_stop.rc | default(0) == 0 }}"
        remote_start_preflight_check_result:
          name: remote_start preflight stop
          status: "{{ 'OK' if (not remote_start_preflight_stop_enabled | bool or not remote_start_preflight_exists | bool or remote_start_preflight_stop_ok | bool) else 'WARN' }}"
          detail: >-
            {{
              'stop disabled by stop_remote_start_during_run=false'
              if not remote_start_preflight_stop_enabled | bool
              else (
                'remote_start.service not found'
                if not remote_start_preflight_exists | bool
                else (
                  'stopped remote_start.service'
                  if remote_start_preflight_stop_ok | bool
                  else 'failed to stop remote_start.service'
                )
              )
            }}
          stdout: "{{ remote_start_preflight_stop.stdout | default(remote_start_preflight_unit.stdout | default('')) }}"
          stderr: "{{ remote_start_preflight_stop.stderr | default(remote_start_preflight_unit.stderr | default('')) }}"

    - name: Record remote_start preflight stop install result
      ansible.builtin.set_fact:
        g1_install_results: "{{ g1_install_results + [{
          'name': 'remote_start preflight stop',
          'changed': remote_start_preflight_stop.changed | default(false),
          'rc': 0,
          'status': 'OK' if (not (stop_remote_start_during_run | default(true) | bool) or (remote_start_preflight_unit.stdout | default('') | trim | length == 0) or (remote_start_preflight_stop.rc | default(0) == 0)) else 'WARN',
          'detail': remote_start_preflight_install_detail,
          'stdout': remote_start_preflight_stop.stdout | default(remote_start_preflight_unit.stdout | default('')),
          'stderr': remote_start_preflight_stop.stderr | default(remote_start_preflight_unit.stderr | default(''))
        }] }}"
      vars:
        remote_start_preflight_install_detail: >-
          {{
            'stop disabled by stop_remote_start_during_run=false'
            if not (stop_remote_start_during_run | default(true) | bool)
            else (
              'remote_start.service not found'
              if remote_start_preflight_unit.stdout | default('') | trim | length == 0
              else (
                'stopped remote_start.service'
                if remote_start_preflight_stop.rc | default(0) == 0
                else 'failed to stop remote_start.service'
              )
            )
          }}
      when: g1_run_mode == 'install'

    - name: Get controller current time before installation
      ansible.builtin.command: date "+%Y-%m-%d %H:%M:%S"
      register: controller_time
      changed_when: false
      delegate_to: localhost
      when: g1_run_mode == 'install'

    - name: Sync robot time from controller before installation
      become: true
      ansible.builtin.command: date -s "{{ controller_time.stdout }}"
      when: g1_run_mode == 'install'

    - name: Run common installation tasks
      ansible.builtin.import_tasks: tasks/install_common.yml
      when: g1_run_mode == 'install'

    - name: Run dex1 installation tasks
      ansible.builtin.import_tasks: tasks/install_dex1.yml
      when:
        - g1_run_mode == 'install'
        - g1_end_effector == 'dex1'

    - name: Run brainco installation tasks
      ansible.builtin.import_tasks: tasks/install_brainco.yml
      when:
        - g1_run_mode == 'install'
        - g1_end_effector == 'brainco'

    - name: Stop conflicting brainco service for dex1
      become: true
      ansible.builtin.command: "systemctl stop brainco_hand.service"
      register: stop_conflicting_brainco_service
      changed_when: stop_conflicting_brainco_service.rc == 0
      failed_when: false
      when:
        - g1_run_mode == 'install'
        - g1_end_effector == 'dex1'
        - stop_conflicting_end_effector_service | default(true) | bool

    - name: Disable conflicting brainco service for dex1
      become: true
      ansible.builtin.command: "systemctl disable brainco_hand.service"
      register: disable_conflicting_brainco_service
      changed_when: disable_conflicting_brainco_service.rc == 0
      failed_when: false
      when:
        - g1_run_mode == 'install'
        - g1_end_effector == 'dex1'
        - disable_conflicting_end_effector_service | default(true) | bool

    - name: Record conflicting brainco service stop result
      ansible.builtin.set_fact:
        g1_install_results: "{{ g1_install_results + [{
          'name': 'stop conflicting brainco service',
          'changed': (stop_conflicting_brainco_service.changed | default(false)) or (disable_conflicting_brainco_service.changed | default(false)),
          'rc': 0,
          'detail': 'end_effector=dex1, stopped brainco_hand.service',
          'stdout': (stop_conflicting_brainco_service.stdout | default('')) ~ '\n' ~ (disable_conflicting_brainco_service.stdout | default('')),
          'stderr': (stop_conflicting_brainco_service.stderr | default('')) ~ '\n' ~ (disable_conflicting_brainco_service.stderr | default(''))
        }] }}"
      when:
        - g1_run_mode == 'install'
        - g1_end_effector == 'dex1'

    - name: Stop conflicting dex1 service for brainco
      become: true
      ansible.builtin.command: "systemctl stop dex1_gripper.service"
      register: stop_conflicting_dex1_service
      changed_when: stop_conflicting_dex1_service.rc == 0
      failed_when: false
      when:
        - g1_run_mode == 'install'
        - g1_end_effector == 'brainco'
        - stop_conflicting_end_effector_service | default(true) | bool

    - name: Disable conflicting dex1 service for brainco
      become: true
      ansible.builtin.command: "systemctl disable dex1_gripper.service"
      register: disable_conflicting_dex1_service
      changed_when: disable_conflicting_dex1_service.rc == 0
      failed_when: false
      when:
        - g1_run_mode == 'install'
        - g1_end_effector == 'brainco'
        - disable_conflicting_end_effector_service | default(true) | bool

    - name: Record conflicting dex1 service stop result
      ansible.builtin.set_fact:
        g1_install_results: "{{ g1_install_results + [{
          'name': 'stop conflicting dex1 service',
          'changed': (stop_conflicting_dex1_service.changed | default(false)) or (disable_conflicting_dex1_service.changed | default(false)),
          'rc': 0,
          'detail': 'end_effector=brainco, stopped dex1_gripper.service',
          'stdout': (stop_conflicting_dex1_service.stdout | default('')) ~ '\n' ~ (disable_conflicting_dex1_service.stdout | default('')),
          'stderr': (stop_conflicting_dex1_service.stderr | default('')) ~ '\n' ~ (disable_conflicting_dex1_service.stderr | default(''))
        }] }}"
      when:
        - g1_run_mode == 'install'
        - g1_end_effector == 'brainco'

    - name: Stop dex1 service when no end effector is selected
      become: true
      ansible.builtin.command: "systemctl stop dex1_gripper.service"
      register: stop_none_dex1_service
      changed_when: stop_none_dex1_service.rc == 0
      failed_when: false
      when:
        - g1_run_mode == 'install'
        - g1_end_effector == 'none'
        - stop_conflicting_end_effector_service | default(true) | bool

    - name: Stop brainco service when no end effector is selected
      become: true
      ansible.builtin.command: "systemctl stop brainco_hand.service"
      register: stop_none_brainco_service
      changed_when: stop_none_brainco_service.rc == 0
      failed_when: false
      when:
        - g1_run_mode == 'install'
        - g1_end_effector == 'none'
        - stop_conflicting_end_effector_service | default(true) | bool

    - name: Disable dex1 service when no end effector is selected
      become: true
      ansible.builtin.command: "systemctl disable dex1_gripper.service"
      register: disable_none_dex1_service
      changed_when: disable_none_dex1_service.rc == 0
      failed_when: false
      when:
        - g1_run_mode == 'install'
        - g1_end_effector == 'none'
        - disable_conflicting_end_effector_service | default(true) | bool

    - name: Disable brainco service when no end effector is selected
      become: true
      ansible.builtin.command: "systemctl disable brainco_hand.service"
      register: disable_none_brainco_service
      changed_when: disable_none_brainco_service.rc == 0
      failed_when: false
      when:
        - g1_run_mode == 'install'
        - g1_end_effector == 'none'
        - disable_conflicting_end_effector_service | default(true) | bool

    - name: Record all end effector service stop result
      ansible.builtin.set_fact:
        g1_install_results: "{{ g1_install_results + [{
          'name': 'stop all end effector services',
          'changed': (stop_none_dex1_service.changed | default(false)) or (stop_none_brainco_service.changed | default(false)) or (disable_none_dex1_service.changed | default(false)) or (disable_none_brainco_service.changed | default(false)),
          'rc': 0,
          'detail': 'end_effector=none, stopped dex1 and brainco services',
          'stdout': (stop_none_dex1_service.stdout | default('')) ~ '\n' ~ (stop_none_brainco_service.stdout | default('')) ~ '\n' ~ (disable_none_dex1_service.stdout | default('')) ~ '\n' ~ (disable_none_brainco_service.stdout | default('')),
          'stderr': (stop_none_dex1_service.stderr | default('')) ~ '\n' ~ (stop_none_brainco_service.stderr | default('')) ~ '\n' ~ (disable_none_dex1_service.stderr | default('')) ~ '\n' ~ (disable_none_brainco_service.stderr | default(''))
        }] }}"
      when:
        - g1_run_mode == 'install'
        - g1_end_effector == 'none'

    - name: Reset check results before final verification
      ansible.builtin.set_fact:
        g1_check_results: []
      when: g1_run_mode == 'install'

    - name: Run common environment checks
      ansible.builtin.import_tasks: tasks/common.yml

    - name: Run dex1 checks
      ansible.builtin.import_tasks: tasks/dex1.yml
      when: g1_end_effector == 'dex1'

    - name: Run brainco checks
      ansible.builtin.import_tasks: tasks/brainco.yml
      when: g1_end_effector == 'brainco'

    - name: Record skipped end effector checks
      ansible.builtin.set_fact:
        g1_check_results: "{{ g1_check_results + [{'name': 'end effector service', 'status': 'SKIP', 'detail': 'end_effector=' ~ g1_end_effector}] }}"
      when: g1_end_effector == 'none'

    - name: Record invalid end effector checks
      ansible.builtin.set_fact:
        g1_check_results: "{{ g1_check_results + [{'name': 'end effector service', 'status': 'FAIL', 'detail': 'invalid end_effector=' ~ g1_end_effector}] }}"
      when: g1_end_effector not in supported_end_effectors

    - name: Build final report
      ansible.builtin.import_tasks: tasks/report.yml
